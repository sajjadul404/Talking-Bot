<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="680" rx="20" fill="url(#bgGrad)" />

  <g transform="translate(50, 40)">
    <!-- Main Window Card -->
    <rect width="1100" height="600" rx="16" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="1100" height="48" rx="16" fill="#111827" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#eab308" />
    <circle cx="68" cy="24" r="6" fill="#22c55e" />
    <text x="550" y="28" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      🎙️ Web Speech API - Voice to Text in Action
    </text>

    <!-- Center Focus Box -->
    <rect x="150" y="90" width="800" height="470" rx="20" fill="#131d2e" stroke="#1e293b" stroke-width="1.5" />

    <!-- Big Animated Microphone Visualizer -->
    <circle cx="550" cy="220" r="65" fill="#ef4444" opacity="0.15" filter="url(#glow)" />
    <circle cx="550" cy="220" r="50" fill="url(#micGrad)" filter="url(#glow)" />
    <!-- Mic icon inside circle -->
    <rect x="542" y="200" width="16" height="24" rx="8" fill="#ffffff" />
    <path d="M 536 214 C 536 230, 564 230, 564 214" stroke="#ffffff" stroke-width="3" fill="none" />
    <line x1="550" y1="230" x2="550" y2="242" stroke="#ffffff" stroke-width="3" />
    <line x1="540" y1="242" x2="560" y2="242" stroke="#ffffff" stroke-width="3" />

    <!-- Sound waves -->
    <path d="M 460 200 Q 450 220 460 240" stroke="#f87171" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 440 185 Q 425 220 440 255" stroke="#f87171" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" />
    <path d="M 640 200 Q 650 220 640 240" stroke="#f87171" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 660 185 Q 675 220 660 255" stroke="#f87171" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" />

    <text x="550" y="310" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">
      Microphone Listening &amp; Converting Speech...
    </text>
    <text x="550" y="338" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">
      Native browser Web Speech API (continuous &amp; interim results)
    </text>

    <!-- Live Speech Banner simulation -->
    <rect x="220" y="375" width="660" height="46" rx="12" fill="#172554" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="245" cy="398" r="5" fill="#ef4444" />
    <text x="260" y="403" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="700">Listening...</text>
    <text x="345" y="403" fill="#93c5fd" font-family="sans-serif" font-size="13" font-style="italic">
      "Write a Python script for calculating Fibonacci series"
    </text>
    <rect x="760" y="384" width="105" height="28" rx="8" fill="#ef4444" />
    <text x="812" y="402" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      Done Speaking
    </text>

    <!-- Real-time Text in Input Field -->
    <rect x="220" y="440" width="660" height="54" rx="16" fill="#0b0f19" stroke="#3b82f6" stroke-width="1.5" />
    <text x="245" y="473" fill="#f8fafc" font-family="sans-serif" font-size="14">
      Write a Python script for calculating Fibonacci series
    </text>
    <!-- blinking cursor -->
    <line x1="620" y1="458" x2="620" y2="486" stroke="#38bdf8" stroke-width="2" />
  </g>
</svg>
