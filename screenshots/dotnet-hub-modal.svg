<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" rx="20" fill="url(#bgGrad)" />

  <g transform="translate(60, 40)">
    <!-- Window Card -->
    <rect width="1080" height="600" rx="16" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="1080" height="48" rx="16" fill="#111827" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#eab308" />
    <circle cx="68" cy="24" r="6" fill="#22c55e" />
    <text x="540" y="28" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      ⚡ .NET 8 C# Architecture Hub &amp; Interactive Code Explorer
    </text>

    <!-- Header Banner in Modal -->
    <rect x="50" y="75" width="980" height="85" rx="14" fill="url(#purpleGrad)" />
    <text x="80" y="112" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">
      C# .NET 8.0 Enterprise Backend &amp; Talking Bot Engine
    </text>
    <text x="80" y="136" fill="#e9d5ff" font-family="sans-serif" font-size="13">
      Production ASP.NET Core Web API with Gemini AI REST client, Multi-Turn Context Memory &amp; Dockerfile
    </text>

    <!-- Code Preview Card -->
    <rect x="50" y="180" width="600" height="380" rx="12" fill="#090d16" stroke="#1f2937" stroke-width="1" />
    <rect x="50" y="180" width="600" height="36" rx="12" fill="#111827" />
    <text x="70" y="203" fill="#38bdf8" font-family="monospace" font-size="12">GeminiService.cs (HttpClient REST Integration)</text>

    <text x="70" y="240" fill="#c084fc" font-family="monospace" font-size="12">public class <tspan fill="#60a5fa">GeminiService</tspan> : <tspan fill="#34d399">IGeminiService</tspan></text>
    <text x="70" y="262" fill="#cbd5e1" font-family="monospace" font-size="12">{</text>
    <text x="90" y="284" fill="#94a3b8" font-family="monospace" font-size="12">    private readonly HttpClient _http;</text>
    <text x="90" y="306" fill="#94a3b8" font-family="monospace" font-size="12">    private const string Model = "gemini-3.8-flash";</text>
    <text x="90" y="340" fill="#c084fc" font-family="monospace" font-size="12">    public async Task&lt;<tspan fill="#60a5fa">ChatResponse</tspan>&gt; <tspan fill="#34d399">AskAsync</tspan>(ChatRequest req)</text>
    <text x="90" y="362" fill="#cbd5e1" font-family="monospace" font-size="12">    {</text>
    <text x="110" y="384" fill="#64748b" font-family="monospace" font-size="12">        // Formulate multi-turn contents &amp; system instruction</text>
    <text x="110" y="406" fill="#94a3b8" font-family="monospace" font-size="12">        var payload = BuildGeminiPayload(req);</text>
    <text x="110" y="428" fill="#94a3b8" font-family="monospace" font-size="12">        var response = await _http.PostAsJsonAsync(url, payload);</text>
    <text x="110" y="450" fill="#38bdf8" font-family="monospace" font-size="12">        return await ExtractResponseAsync(response);</text>
    <text x="90" y="472" fill="#cbd5e1" font-family="monospace" font-size="12">    }</text>
    <text x="70" y="494" fill="#cbd5e1" font-family="monospace" font-size="12">}</text>

    <!-- Right Side: Architecture Features -->
    <rect x="670" y="180" width="360" height="380" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="695" y="215" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Core Highlights</text>
    
    <rect x="695" y="235" width="310" height="60" rx="8" fill="#1e293b" />
    <text x="710" y="258" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="bold">🎯 Clean REST Architecture</text>
    <text x="710" y="278" fill="#94a3b8" font-family="sans-serif" font-size="11">Dependency Injection &amp; Controller pipeline</text>

    <rect x="695" y="310" width="310" height="60" rx="8" fill="#1e293b" />
    <text x="710" y="333" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">🛡️ Intelligent Fallback</text>
    <text x="710" y="353" fill="#94a3b8" font-family="sans-serif" font-size="11">Graceful handling for zero API downtime</text>

    <rect x="695" y="385" width="310" height="60" rx="8" fill="#1e293b" />
    <text x="710" y="408" fill="#f43f5e" font-family="sans-serif" font-size="13" font-weight="bold">🐳 Docker &amp; Cloud Ready</text>
    <text x="710" y="428" fill="#94a3b8" font-family="sans-serif" font-size="11">Deployable to Cloud Run, Azure or Render</text>

    <rect x="695" y="460" width="310" height="60" rx="8" fill="#1e293b" />
    <text x="710" y="483" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">📖 Swagger / OpenAPI</text>
    <text x="710" y="503" fill="#94a3b8" font-family="sans-serif" font-size="11">Interactive API testing on /swagger</text>
  </g>
</svg>
