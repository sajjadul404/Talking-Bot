<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" rx="20" fill="url(#bgGrad)" />

  <!-- App Window Frame -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1100" height="600" rx="16" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Title Bar -->
    <rect x="50" y="40" width="1100" height="48" rx="16" fill="#111827" />
    <circle cx="78" cy="64" r="6" fill="#ef4444" />
    <circle cx="98" cy="64" r="6" fill="#eab308" />
    <circle cx="118" cy="64" r="6" fill="#22c55e" />
    <text x="600" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      Talking Bot - AI Assistant (gemini-3.8-flash)
    </text>

    <!-- Sidebar Simulation -->
    <rect x="50" y="88" width="240" height="552" fill="#0d131f" stroke="#1f2937" stroke-width="1" />
    <!-- Bot Avatar in Sidebar -->
    <rect x="74" y="112" width="40" height="40" rx="10" fill="url(#botGrad)" />
    <circle cx="90" cy="128" r="3" fill="#ffffff" />
    <circle cx="100" cy="128" r="3" fill="#ffffff" />
    <rect x="86" y="136" width="16" height="3" rx="1.5" fill="#ffffff" />
    <text x="124" y="130" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Talking Bot</text>
    <text x="124" y="144" fill="#38bdf8" font-family="sans-serif" font-size="11">● Online (AI Active)</text>

    <!-- Sidebar Navigation Items -->
    <rect x="66" y="174" width="208" height="36" rx="8" fill="#1e293b" />
    <text x="82" y="197" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="600">💬 Active Chat</text>
    <text x="82" y="240" fill="#94a3b8" font-family="sans-serif" font-size="13">📜 Chat History</text>
    <text x="82" y="280" fill="#94a3b8" font-family="sans-serif" font-size="13">⚙️ Settings</text>
    <text x="82" y="320" fill="#94a3b8" font-family="sans-serif" font-size="13">⚡ .NET C# Hub</text>

    <!-- Main Chat View Area -->
    <rect x="290" y="88" width="860" height="552" fill="#0b0f19" />

    <!-- Chat Message 1: Bot Welcome -->
    <rect x="330" y="120" width="42" height="42" rx="12" fill="url(#botGrad)" />
    <text x="343" y="146" fill="#ffffff" font-size="20">🤖</text>
    <rect x="385" y="120" width="580" height="96" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="405" y="150" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">
      Hello! 👋 I am Talking Bot, your intelligent AI conversation assistant.
    </text>
    <text x="405" y="174" fill="#94a3b8" font-family="sans-serif" font-size="13">
      You can type or click the microphone to speak with me using the Web Speech API!
    </text>
    <text x="405" y="198" fill="#60a5fa" font-family="sans-serif" font-size="11">
      Powered by Google Gemini 3.8 Flash • Multi-turn Memory Active
    </text>

    <!-- Chat Message 2: User Query -->
    <rect x="680" y="240" width="420" height="54" rx="16" fill="url(#primaryGrad)" />
    <text x="704" y="272" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="500">
      Explain how C# and .NET 8 work with Gemini AI!
    </text>

    <!-- Chat Message 3: Bot Response -->
    <rect x="330" y="318" width="42" height="42" rx="12" fill="url(#botGrad)" />
    <text x="343" y="344" fill="#ffffff" font-size="20">🤖</text>
    <rect x="385" y="318" width="670" height="140" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="405" y="348" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">
      Here is how the C# backend integrates with Gemini AI:
    </text>
    <text x="405" y="375" fill="#94a3b8" font-family="sans-serif" font-size="13">
      • ASP.NET Core 8 Web API routes incoming chat requests via HttpClient.
    </text>
    <text x="405" y="400" fill="#94a3b8" font-family="sans-serif" font-size="13">
      • Conversational context is maintained across turns using structured message history.
    </text>
    <text x="405" y="425" fill="#94a3b8" font-family="sans-serif" font-size="13">
      • Automatic fallback guarantees 100% continuous responses even offline!
    </text>

    <!-- Input Bar Area -->
    <rect x="320" y="540" width="800" height="58" rx="18" fill="#131c2e" stroke="#2563eb" stroke-width="1.5" />
    <text x="350" y="575" fill="#94a3b8" font-family="sans-serif" font-size="14">
      Ask me anything, or speak into the microphone...
    </text>

    <!-- Microphone Toggle Active Button -->
    <rect x="1010" y="548" width="42" height="42" rx="12" fill="#ef4444" />
    <circle cx="1031" cy="565" r="5" fill="#ffffff" />
    <path d="M 1026 567 C 1026 573, 1036 573, 1036 567" stroke="#ffffff" stroke-width="2" fill="none" />
    <line x1="1031" y1="573" x2="1031" y2="577" stroke="#ffffff" stroke-width="2" />

    <!-- Send Button -->
    <rect x="1062" y="548" width="42" height="42" rx="12" fill="#2563eb" />
    <polygon points="1078,564 1092,569 1078,574" fill="#ffffff" />
  </g>
</svg>
